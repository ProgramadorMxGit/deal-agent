[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ofertas_hunter"
version = "0.1.0"
description = "Bot autónomo de detección de ofertas y errores de precio (Amazon MX, Mercado Libre MX, Telegram) con publicación a WhatsApp via Evolution API."
authors = [{name = "ofertas_hunter team"}]
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = {text = "Proprietary"}

dependencies = [
    "playwright==1.44.0",
    "aiofiles==23.2.1",
    "beautifulsoup4==4.12.3",
    "httpx==0.27.2",
    "pydantic==2.11.7",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.1",
    "structlog==24.1.0",
    "tenacity==8.2.3",
    "tzdata==2026.2",
    "jsonschema==4.22.0",
    "mcp==1.27.1",
    "rich==13.7.1",
]

[project.optional-dependencies]
telegram = [
    "telethon==1.36.0",
]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[project.scripts]
ofertas-hunter = "ofertas_hunter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
