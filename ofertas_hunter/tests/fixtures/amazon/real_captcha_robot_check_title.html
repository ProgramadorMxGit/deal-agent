<!DOCTYPE html>
<html lang="en">
<head>
  <title>Robot Check</title>
  <meta charset="utf-8">
</head>
<body>
  <div class="a-container">
    <h4>Robot Check</h4>
    <form method="get" action="/errors/validateCaptcha" name="">
      <input type="hidden" name="amzn" value="abc123==">
      <input type="hidden" name="amzn-r" value="/dp/B0CEXAMPLE">
      <div class="a-row a-text-center">
        <img src="https://images-na.ssl-images-amazon.com/captcha/xyz/Captcha_xyz.jpg" alt="">
      </div>
      <div class="a-row">
        <label>Enter the characters you see below</label>
        <input id="captchacharacters" name="field-keywords" type="text">
      </div>
      <button type="submit">Continue shopping</button>
    </form>
  </div>
</body>
</html>
