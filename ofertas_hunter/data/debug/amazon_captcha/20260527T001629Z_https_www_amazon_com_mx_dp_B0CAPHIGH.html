<!DOCTYPE html><html class="a-no-js" lang="es-mx"><head>
<title dir="ltr">Amazon.com.mx</title>
<meta charset="utf-8">
</head>
<body>
<div class="a-container a-padding-double-large">
  <div class="a-row a-spacing-double-large">
    <div class="a-row a-spacing-medium a-text-center"><i class="a-icon a-logo"></i></div>
    <div class="a-box a-alert a-alert-info a-spacing-base">
      <div class="a-box-inner">
        <h4>Haz clic en el botón de abajo para continuar comprando</h4>
      </div>
    </div>
    <div class="a-section">
      <div class="a-box a-color-offset-background">
        <div class="a-box-inner a-padding-extra-large">
          <form method="get" action="/errors/validateCaptcha" name="">
            <input type="hidden" name="amzn" value="abc==">
            <input type="hidden" name="amzn-r" value="/dp/B0EXAMPLE">
            <input type="hidden" name="field-keywords" value="ABCD12">
            <div class="a-section a-spacing-extra-large">
              <div class="a-row">
                <span class="a-button a-button-primary a-span12">
                  <span class="a-button-inner">
                    <button type="submit" class="a-button-text">Continuar a Compras</button>
                  </span>
                </span>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
